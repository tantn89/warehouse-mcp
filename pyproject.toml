[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "warehouse-mcp"
dynamic = ["version"]
description = "Governed, read-only MCP access to DuckDB, Postgres and BigQuery for AI agents: semantic layer, SQL guard, row policies, PII pseudonymization, audit log."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tan Tran" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "data-warehouse", "duckdb",
            "postgres", "bigquery", "text-to-sql", "data-governance", "pii"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2.3,<3",
  "sqlglot>=30.27,<31",
  "duckdb>=1.4",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
bigquery = ["google-cloud-bigquery>=3.25"]
eval = ["anthropic>=0.70", "regressgate>=0.1"]
dev = [
  "psycopg[binary]>=3.2",
  "google-cloud-bigquery>=3.25",
  "anyio>=4.4",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[project.scripts]
warehouse-mcp = "warehouse_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/tantn89/warehouse-mcp"
Issues = "https://github.com/tantn89/warehouse-mcp/issues"

[tool.hatch.version]
path = "src/warehouse_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
