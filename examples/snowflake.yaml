# The demo semantic model (datasets, metrics, roles) served from Snowflake.
#
#   # once, as ACCOUNTADMIN in Snowsight: docker/snowflake-setup.sql
#   python scripts/load_snapshot.py --target snowflake --account <orgname-accountname>
#   export WAREHOUSE_MCP_SNOWFLAKE_ACCOUNT=<orgname-accountname>
#   export WAREHOUSE_MCP_SNOWFLAKE_KEY_FILE=<path to the reader's PKCS#8 private key>
#   export WAREHOUSE_MCP_SCHEMA=WAREHOUSE_MCP.WIKIPEDIA   # required, see below
#   warehouse-mcp --config examples/snowflake.yaml
#
# Least privilege, set up by docker/snowflake-setup.sql:
# - MCP_READER_SVC is a TYPE=SERVICE user: key-pair auth only, no password, no browser login.
# - Its role MCP_READER holds USAGE on warehouse MCP_WH, database WAREHOUSE_MCP and schema
#   WIKIPEDIA, and SELECT on the tables in that schema, plus what the account grants PUBLIC
#   (often SNOWFLAKE_SAMPLE_DATA). No CREATE privilege: writes to the tables and new permanent
#   tables or stages fail on grants even with the SQL guard bypassed.
# - Temporary tables and the user stage (@~) need no grant. They are private to the session,
#   refused by the SQL guard, and unloads to @~ are switched off on the user
#   (PREVENT_UNLOAD_TO_INTERNAL_STAGES).
# - MCP_WH is an XS warehouse that suspends after 60 s idle, under a resource monitor that
#   suspends it at a small credit quota, with a 60 s statement timeout. The backend sets the
#   same timeout on its session and the per-query limit on each statement.
#
# The session gets no current database or schema, so tables must be database.schema.<table>:
# a reference that escaped the guard's rewrite then resolves to nothing instead of a raw table.
# The private key stays in a file named by an environment variable, never in this config.
extends: demo:wikipedia

connection:
  kind: snowflake
  account: ${WAREHOUSE_MCP_SNOWFLAKE_ACCOUNT}
  user: ${WAREHOUSE_MCP_SNOWFLAKE_USER:-MCP_READER_SVC}
  role: MCP_READER
  warehouse: MCP_WH
  private_key_file_env: WAREHOUSE_MCP_SNOWFLAKE_KEY_FILE
  statement_timeout_s: 60
